<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Watch Rotation Planner</title>
<style>
:root{--ink:#e4e9ef;--muted:#9aa8b7;--paper:#0f151c;--card:#17202a;--line:#2b3642;--accent:#7fb2e5;--field:#0d1319;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 "IBM Plex Sans",Arial,sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;width:100%;max-width:360px;display:grid;gap:12px}
h1{font:700 22px/1.2 "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input{font:inherit;color:var(--ink);background:var(--field);border:1px solid #3a4858;border-radius:5px;padding:9px 10px;width:100%}
button{font:600 15px inherit;font-family:inherit;border:0;border-radius:6px;background:var(--accent);color:#0b1520;padding:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:#ff9e9e;min-height:1.2em}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
const KEY="watchRota.pw."+D.s;
let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
if(saved)open(saved).catch(()=>{try{localStorage.removeItem(KEY)}catch(e){}});
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err"),pw=document.getElementById("pw").value;
  b.disabled=true;b.textContent="Opening…";er.textContent="";
  try{await open(pw);try{if(document.getElementById("rem")&&document.getElementById("rem").checked)localStorage.setItem(KEY,pw)}catch(x){}}
  catch(x){er.textContent="That password isn't right. Try again.";b.disabled=false;b.textContent="Open";}
});
