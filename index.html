<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"><title>Watch Rotation Planner</title>
<style>
:root{--ink:#1c2630;--muted:#5d6a77;--card:#f5f4f0;--line:#d9dcd8;--brass:#b8913f;--brass2:#d8b569;--field:#fff;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(165deg,#22303d 0%,#3b5063 55%,#2c3d4e 100%);color:var(--ink);font:15px/1.5 "Source Sans 3","Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--card);border-radius:10px;padding:26px;width:100%;max-width:380px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(8,16,24,.35)}
.eb{font:600 12px/1 inherit;font-family:inherit;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin:0}
h1{font:400 30px/1.1 "DM Serif Display",Georgia,serif;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input{font:inherit;color:var(--ink);background:var(--field);border:1px solid #c5cbd0;border-radius:6px;padding:9px 10px;width:100%}
button{font:700 15px inherit;font-family:inherit;border:1px solid #9c7a32;border-radius:6px;background:linear-gradient(180deg,var(--brass2),var(--brass));color:#1d1608;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.err{color:#9b1c1c;min-height:1.2em}
</style></head><body>
<form id="f"><p class="eb">Watch log</p><h1>Watch Rotation Planner</h1><p>This page is password protected.</p>
<label for="pw">Password<input id="pw" type="password" autocomplete="current-password" autofocus required></label>
<label style="display:flex;gap:8px;align-items:center"><input id="rem" type="checkbox" style="width:auto"> Remember on this device</label>
<button id="go" type="submit">Open</button><p class="err" id="err" role="alert"></p></form>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
const KEY="watchRota.pw."+D.s;

document.getElementById("f").addEventListener("submit",async e=>{
